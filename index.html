<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapılacaklar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== AUTH EKRANI ===== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-header">
        <h1>📒 Yapılacaklar</h1>
        <p class="auth-subtitle">Notlarına hoş geldin</p>
      </div>

      <!-- Sekme -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Giriş Yap</button>
        <button class="auth-tab" data-tab="register">Kayıt Ol</button>
      </div>

      <!-- Giriş Formu -->
      <form id="login-form" class="auth-form">
        <div class="field">
          <label>E-posta</label>
          <input type="email" id="login-email" placeholder="ornek@eposta.com" required />
        </div>
        <div class="field">
          <label>Şifre</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="auth-btn" id="login-btn">Giriş Yap</button>
        <p class="auth-error" id="login-error"></p>
      </form>

      <!-- Kayıt Formu -->
      <form id="register-form" class="auth-form hidden">
        <div class="field">
          <label>E-posta</label>
          <input type="email" id="reg-email" placeholder="ornek@eposta.com" required />
        </div>
        <div class="field">
          <label>Şifre <span class="hint">(en az 6 karakter)</span></label>
          <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="field">
          <label>Şifre Tekrar</label>
          <input type="password" id="reg-password2" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" class="auth-btn" id="reg-btn">Kayıt Ol</button>
        <p class="auth-error" id="reg-error"></p>
      </form>
    </div>
  </div>

  <!-- ===== UYGULAMA EKRANI ===== -->
  <div id="app-screen" class="hidden">
    <div class="notebook">
      <div class="spiral">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </div>

      <div class="container">
        <div class="margin-line"></div>

        <div class="page-content">
          <!-- Üst bar: başlık + kullanıcı -->
          <div class="top-bar">
            <h1>✏️ Yapılacaklar</h1>
            <div class="user-area">
              <span id="user-email-label"></span>
              <button id="logout-btn" title="Çıkış yap">↩ Çıkış</button>
            </div>
          </div>

          <form id="todo-form" class="todo-form">
            <input type="text" id="todo-input" placeholder="Buraya yaz…" autocomplete="off" />
            <button type="submit">+ Ekle</button>
          </form>

          <div class="filters">
            <button class="filter-btn active" data-filter="all">Tümü</button>
            <button class="filter-btn" data-filter="active">Aktif</button>
            <button class="filter-btn" data-filter="completed">Tamam ✓</button>
          </div>

          <ul id="todo-list" class="todo-list"></ul>

          <div class="footer">
            <span id="item-count">0 görev kaldı</span>
            <button id="clear-completed">Tamamlananları sil</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

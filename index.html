<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapılacaklar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════
       GİRİŞ / KAYIT EKRANI
       Aynı notebook yapısı kullanılıyor
  ════════════════════════════════════════ -->
  <div id="auth-screen">
    <div class="notebook">

      <!-- Spiral halkalar -->
      <div class="spiral">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </div>

      <div class="container">
        <div class="margin-line"></div>

        <div class="page-content">

          <!-- Başlık -->
          <div class="page-title">
            <h1>📒 Yapılacaklar</h1>
          </div>

          <!-- Sekme — filtre butonlarıyla aynı stil -->
          <div class="filters" style="margin-bottom: 24px;">
            <button class="filter-btn active" data-tab="login"    id="tab-login">Giriş Yap</button>
            <button class="filter-btn"        data-tab="register" id="tab-register">Kayıt Ol</button>
          </div>

          <!-- Giriş Formu -->
          <form id="login-form">

            <div class="field-row">
              <span class="field-label">E-posta</span>
              <input type="email" id="login-email" class="line-input"
                     placeholder="ornek@eposta.com" autocomplete="email" required />
            </div>

            <div class="field-row">
              <span class="field-label">Şifre</span>
              <input type="password" id="login-password" class="line-input"
                     placeholder="••••••••" required />
            </div>

            <div class="form-footer-row">
              <button type="submit" class="submit-btn" id="login-btn">Giriş Yap →</button>
              <span class="inline-error" id="login-error"></span>
            </div>

          </form>

          <!-- Kayıt Formu -->
          <form id="register-form" class="hidden">

            <div class="field-row">
              <span class="field-label">E-posta</span>
              <input type="email" id="reg-email" class="line-input"
                     placeholder="ornek@eposta.com" autocomplete="email" required />
            </div>

            <div class="field-row">
              <span class="field-label">Şifre</span>
              <input type="password" id="reg-password" class="line-input"
                     placeholder="en az 6 karakter" required minlength="6" />
            </div>

            <div class="field-row">
              <span class="field-label">Tekrar</span>
              <input type="password" id="reg-password2" class="line-input"
                     placeholder="••••••••" required minlength="6" />
            </div>

            <div class="form-footer-row">
              <button type="submit" class="submit-btn" id="reg-btn">Kayıt Ol →</button>
              <span class="inline-error" id="reg-error"></span>
            </div>

          </form>

        </div><!-- /page-content -->
      </div><!-- /container -->
    </div><!-- /notebook -->
  </div><!-- /auth-screen -->


  <!-- ═══════════════════════════════════════
       TODO EKRANI
  ════════════════════════════════════════ -->
  <div id="app-screen" class="hidden">
    <div class="notebook">

      <div class="spiral">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </div>

      <div class="container">
        <div class="margin-line"></div>

        <div class="page-content">

          <!-- Başlık + kullanıcı satırı -->
          <div class="page-title">
            <h1>✏️ Yapılacaklar</h1>
            <div class="user-chip">
              <span id="user-email-label"></span>
              <button id="logout-btn">↩ Çıkış</button>
            </div>
          </div>

          <!-- Yeni görev formu -->
          <form id="todo-form" class="todo-add-row">
            <input type="text" id="todo-input" class="line-input"
                   placeholder="Buraya yaz…" autocomplete="off" />
            <button type="submit" class="submit-btn compact">+ Ekle</button>
          </form>

          <!-- Filtreler -->
          <div class="filters">
            <button class="filter-btn active" data-filter="all">Tümü</button>
            <button class="filter-btn"        data-filter="active">Aktif</button>
            <button class="filter-btn"        data-filter="completed">Tamam ✓</button>
          </div>

          <!-- Liste -->
          <ul id="todo-list" class="todo-list"></ul>

          <!-- Alt bilgi -->
          <div class="footer">
            <span id="item-count">0 görev kaldı</span>
            <button id="clear-completed">Tamamlananları sil</button>
          </div>

        </div><!-- /page-content -->
      </div><!-- /container -->
    </div><!-- /notebook -->
  </div><!-- /app-screen -->

  <script src="script.js"></script>
</body>
</html>
